services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: recetario
      POSTGRES_PASSWORD: recetario
      POSTGRES_DB: recetario
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recetario -d recetario"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      target: dev
    env_file:
      - path: .env
        required: false
    environment:
      # Dentro de la red de compose el host de la base es "db"
      DATABASE_URL: postgres://recetario:recetario@db:5432/recetario
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  node_modules:
  next_cache:
